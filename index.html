<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxium</title>
<style>
  :root{--bg:#0a0a0c;--panel:#111114;--border:#1e1e24;--text:#c8c8d0;--dim:#6a6a78;--accent:#7f5af0;--accent2:#2cb67d;--danger:#e5484d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:ui-monospace,'Cascadia Code','Fira Code',monospace;min-height:100vh;display:flex;flex-direction:column;padding:24px;gap:16px}
  header{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border);padding-bottom:12px;flex-wrap:wrap}
  header h1{font-size:20px;letter-spacing:2px;color:var(--accent)}
  header .ver{font-size:12px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{background:var(--border);color:var(--dim);border:none;border-radius:6px 6px 0 0;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px}
  .tab.active{background:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;line-height:1.5;padding:12px;resize:none;outline:none;min-height:300px;tab-size:2}
  textarea::placeholder{color:var(--dim)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:filter .15s}
  button:hover{filter:brightness(1.15)}
  button.secondary{background:var(--border);color:var(--text)}
  label.opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
  label.opt input{accent-color:var(--accent)}
  .stats{font-size:12px;color:var(--dim);margin-left:auto}
  .stats b{color:var(--accent2)}
  footer{font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<header>
  <h1>NOXIUM</h1>
  <span class="ver">v1.1</span>
  <div class="tabs">
    <button class="tab active" data-lang="js">JS</button>
    <button class="tab" data-lang="ts">TS</button>
    <button class="tab" data-lang="css">CSS</button>
    <button class="tab" data-lang="wasm">WASM</button>
  </div>
</header>

<div class="controls">
  <button id="btnObf">Обфусцировать</button>
  <button id="btnCopy" class="secondary">Копировать</button>
  <button id="btnClear" class="secondary">Очистить</button>
  <label class="opt"><input type="checkbox" id="optPseudo" checked> pseudo</label>
  <label class="opt"><input type="checkbox" id="optReturn" checked> local-return</label>
  <label class="opt"><input type="checkbox" id="optStrings" checked> шифр строк</label>
  <label class="opt"><input type="checkbox" id="optGuard" checked> guard</label>
  <span class="stats" id="stats">—</span>
</div>

<div class="grid">
  <div class="panel">
    <div class="panel-head"><span id="inLabel">Вход — JS</span><span id="inLen">0 B</span></div>
    <textarea id="input" placeholder="// Вставь код..." spellcheck="false"></textarea>
  </div>
  <div class="panel">
    <div class="panel-head"><span id="outLabel">Выход — Noxium</span><span id="outLen">0 B</span></div>
    <textarea id="output" placeholder="// Результат" spellcheck="false" readonly></textarea>
  </div>
</div>

<footer>Noxium — локальный обфускатор. Ничего не отправляет. Guard вшивается в конец.</footer>

<script>
(function () {
  "use strict";

  // ---- мигающий title ----
  const titleStates = ["Noxium", "N o x i u m", "N0xium", "NOXIUM", "Noxium_", "Noxium ●", "Noxium ○"];
  let titleIdx = 0;
  setInterval(() => { titleIdx = (titleIdx + 1) % titleStates.length; document.title = titleStates[titleIdx]; }, 500);

  const $ = (id) => document.getElementById(id);
  const inputEl = $("input"), outputEl = $("output"), statsEl = $("stats");
  const inLen = $("inLen"), outLen = $("outLen");
  const inLabel = $("inLabel"), outLabel = $("outLabel");

  let currentLang = "js";

  const randHex = (n) => { let s = ""; for (let i = 0; i < n; i++) s += "0123456789abcdef"[(Math.random()*16)|0]; return s; };
  const randName = (p) => p + "_" + randHex(8);

  // ---- FNV-1a ----
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h.toString(16);
  }

  // ---- XOR + base64 ----
  function xorB64(str, key) {
    let out = "";
    for (let i = 0; i < str.length; i++) out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return btoa(unescape(encodeURIComponent(out)));
  }

  // ---- профили лексеров ----
  const PROFILES = {
    js: {
      quotes: ['"', "'", "`"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
      regex: true,
      keywords: "break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new return super switch this throw try typeof var void while with yield async await static get set of true false null undefined NaN Infinity"
    },
    ts: {
      quotes: ['"', "'", "`"],
      lineComment: "//",
      blockComment: ["/*", "*/"],
      regex: true,
      keywords: "break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new return super switch this throw try typeof var void while with yield async await static get set of true false null undefined NaN Infinity interface type enum implements namespace declare abstract public private protected readonly as keyof infer asserts is unique"
    },
    css: {
      quotes: ['"', "'"],
      lineComment: null,
      blockComment: ["/*", "*/"],
      regex: false,
      keywords: "important media supports keyframes font-face import charset namespace page layer container property"
    },
    wasm: {
      quotes: ['"'],
      lineComment: ";;",
      blockComment: ["(;", ";)"],
      regex: false,
      keywords: "module func param result local global table memory data elem type import export start call block loop if else end br br_if br_table return drop select local.get local.set local.tee global.get global.set i32 i64 f32 f64 const add sub mul div eq ne lt gt le ge and or xor load store"
    }
  };

  // ---- лексер ----
  function lex(src, profile) {
    const p = PROFILES[profile];
    const strings = [];
    const comments = [];
    let out = "";
    let i = 0;
    const n = src.length;
    let prevSignificant = "";

    // long bracket для wasm (; ... ;)
    function readWasmBlock(start) {
      let j = start + 2;
      while (j < n && !src.startsWith(";)", j)) j++;
      if (j >= n) return null;
      return { end: j + 2 };
    }

    while (i < n) {
      const c = src[i];
      const c2 = src[i+1];

      // line comment
      if (p.lineComment && src.startsWith(p.lineComment, i)) {
        let j = i + p.lineComment.length;
        while (j < n && src[j] !== "\n") j++;
        comments.push(src.slice(i, j));
        out += "__NCom" + (comments.length - 1) + "__";
        i = j; continue;
      }

      // block comment
      if (src.startsWith(p.blockComment[0], i)) {
        let j = i + p.blockComment[0].length;
        const close = p.blockComment[1];
        while (j < n && !src.startsWith(close, j)) j++;
        j += close.length;
        comments.push(src.slice(i, j));
        out += "__NCom" + (comments.length - 1) + "__";
        i = j; continue;
      }

      // strings
      if (p.quotes.includes(c)) {
        const quote = c;
        let j = i + 1;
        let val = "";
        while (j < n) {
          if (src[j] === "\\") { val += src[j] + src[j+1]; j += 2; continue; }
          if (src[j] === quote) break;
          val += src[j]; j++;
        }
        strings.push(quote + val + quote);
        out += "__NStr" + (strings.length - 1) + "__";
        i = j + 1; continue;
      }

      // regex literal (js/ts)
      if (p.regex && c === "/") {
        const prev = prevSignificant;
        const regexAllowed = !prev || /[\(\[\{,;:=!&|+\-*%^~<>?]/.test(prev) || /\b(return|typeof|instanceof|in|of|new|delete|void|throw|case|do|else|yield|await)\b/.test(prev);
        if (regexAllowed) {
          let j = i + 1;
          let inClass = false;
          while (j < n) {
            if (src[j] === "\\") { j += 2; continue; }
            if (src[j] === "[") inClass = true;
            else if (src[j] === "]") inClass = false;
            else if (src[j] === "/" && !inClass) break;
            j++;
          }
          j++;
          while (j < n && /[a-z]/i.test(src[j])) j++;
          strings.push(src.slice(i, j));
          out += "__NStr" + (strings.length - 1) + "__";
          prevSignificant = "x";
          i = j; continue;
        }
      }

      out += c;
      if (!/\s/.test(c)) prevSignificant = c;
      i++;
    }
    return { code: out, strings, comments };
  }

  // ---- переименование ----
  // для js/ts: не трогаем после . и :, ключи объектов {key:}
  // для css: не трогаем селекторы после ., #, :, @, и свойства в {}
  // для wasm: не трогаем $names и $ident
  function renameIds(code, profile) {
    const map = new Map();
    const p = PROFILES[profile];
    const KW = new Set(p.keywords.split(" "));
    let braceDepth = 0;
    const re = /[A-Za-z_$][A-Za-z0-9_$]*/g;
    let m;
    let lastIndex = 0;
    let result = "";
    while ((m = re.exec(code)) !== null) {
      const id = m[0];
      const start = m.index;
      const end = start + id.length;
      for (let k = lastIndex; k < start; k++) {
        if (code[k] === "{") braceDepth++;
        else if (code[k] === "}") braceDepth--;
      }
      result += code.slice(lastIndex, start);
      lastIndex = end;

      if (id.startsWith("__N")) { result += id; continue; }
      if (KW.has(id)) { result += id; continue; }

      const before = code.slice(Math.max(0, start - 2), start).trimEnd();
      const after = code.slice(end, end + 2).trimStart();

      if (profile === "css") {
        // не трогаем селекторы: .class, #id, :pseudo, @rule, значения в {}
        if (before.endsWith(".") || before.endsWith("#") || before.endsWith(":") || before.endsWith("@")) { result += id; continue; }
        if (braceDepth > 0) { result += id; continue; } // внутри правил — значения, не трогаем
        // вне правил — это селектор, не трогаем
        result += id; continue;
      }

      if (profile === "wasm") {
        // $names — идентификаторы wasm, не трогаем
        if (before.endsWith("$")) { result += id; continue; }
        result += id; continue;
      }

      // js/ts
      if (before.endsWith(".") || before.endsWith(":")) { result += id; continue; }
      if (after.startsWith(":") && !before.endsWith("?")) { result += id; continue; }

      if (!map.has(id)) map.set(id, randName("_x"));
      result += map.get(id);
    }
    result += code.slice(lastIndex);
    return result;
  }

  // ---- local-return (только js/ts) ----
  function localReturnWrap(code, profile) {
    if (profile !== "js" && profile !== "ts") return code;
    return code.replace(/(function\s*[A-Za-z0-9_$]*\s*\([^)]*\)\s*)\{/g, (m, head) => {
      return head + "{ return (function(){";
    }).replace(/\}(?=\s*(?:;|,|\)|\}))/g, "})(); }");
  }

  // ---- шифр строк ----
  function cipherStrings(strings) {
    const key = randHex(16);
    const enc = strings.map(s => xorB64(s, key));
    return { key, enc };
  }

  // ---- guard ----
  function buildGuard(hash) {
    return `
/* Noxium guard */
(function(){
  "use strict";
  var H=${JSON.stringify(hash)};
  function f(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;}return h.toString(16);}
  var triggers=[];
  try{
    var sc=document.getElementsByTagName("script");
    var last=sc[sc.length-1];
    var src=last&&last.textContent?last.textContent:"";
    if(src&&f(src)!==H)triggers.push("hash");
  }catch(e){}
  var t0=performance.now();debugger;var t1=performance.now();
  if(t1-t0>120)triggers.push("dbg");
  try{if(Function.prototype.toString.toString().indexOf("[native code]")===-1)triggers.push("tos");}catch(e){}
  try{if(console.log.toString().indexOf("native")===-1)triggers.push("con");}catch(e){}
  if(triggers.length){
    var msg="%cKOCH BRATAN%c — обфускацию сняли. Получай.";
    var spam=function(){try{console.log(msg,"color:#e5484d;font-weight:bold;font-size:20px","color:#c8c8d0");}catch(e){}};
    spam();setInterval(spam,250);
    var ac=0;var ai=setInterval(function(){if(ac++>3){clearInterval(ai);return;}try{alert("koch bratan");}catch(e){}},1000);
    var sb=function(){try{sb();}catch(e){setTimeout(sb,0);}};setTimeout(sb,0);
    setTimeout(function(){try{while(true){if(Math.random()<0)break;}}catch(e){setTimeout(arguments.callee,0);}},0);
    var db=function(node,d){if(d>50)return;try{var cl=node.cloneNode(true);node.appendChild(cl);requestAnimationFrame(function(){db(cl,d+1);});}catch(e){requestAnimationFrame(function(){db(node,d+1);});}};
    try{db(document.body,0);}catch(e){}
    var mb=function(){try{window.__noxium_mem__=window.__noxium_mem__||[];window.__noxium_mem__.push(new Array(1e7).fill("koch_bratan"));setTimeout(mb,0);}catch(e){setTimeout(mb,0);}};
    setTimeout(mb,0);
    var pb=function(){Promise.resolve().then(function(){try{pb();}catch(e){}});};pb();
    var tf=0;setInterval(function(){try{document.title=tf++%2?"koch bratan":"сняли обфу";}catch(e){}},100);
    var be=function(e){try{e.stopImmediatePropagation();e.preventDefault();}catch(x){}return false;};
    ["click","keydown","keyup","mousedown","touchstart"].forEach(function(ev){try{window.addEventListener(ev,be,true);}catch(e){}});
  }else{window.__noxium_seal__={v:1,t:Date.now()};}
})();
`;
  }

  // ---- пайплайн ----
  function obfuscate(src, profile) {
    const usePseudo = $("optPseudo").checked;
    const useReturn = $("optReturn").checked;
    const useStrings = $("optStrings").checked;
    const useGuard = $("optGuard").checked;

    let code = src;

    const lexed = lex(code, profile);
    code = lexed.code;

    if (usePseudo) code = renameIds(code, profile);
    if (useReturn) code = localReturnWrap(code, profile);

    let stringTable = "";
    if (useStrings && lexed.strings.length > 0) {
      const { key, enc } = cipherStrings(lexed.strings);
      stringTable = `var __noxium_k = "${key}";\n` +
        `var __noxium_s = [${enc.map(e => `"${e}"`).join(",")}];\n` +
        `function __noxium_dec(s){var raw="";for(var i=0;i<s.length;i++)raw+=String.fromCharCode(s.charCodeAt(i)^__noxium_k.charCodeAt(i%__noxium_k.length));return raw;}\n` +
        `function __noxium_get(i){return __noxium_dec(__noxium_s[i]);}\n`;
      code = code.replace(/__NStr(\d+)__/g, (m, idx) => `__noxium_get(${idx})`);
    } else {
      code = code.replace(/__NStr(\d+)__/g, (m, idx) => lexed.strings[+idx]);
    }

    code = code.replace(/__NCom(\d+)__/g, (m, idx) => lexed.comments[+idx]);

    let guard = "";
    if (useGuard && (profile === "js" || profile === "ts")) {
      guard = buildGuard(fnv1a(code));
    }

    return stringTable + code + "\n" + guard;
  }

  // ---- UI ----
  function updateStats() {
    const inB = new Blob([inputEl.value]).size;
    const outB = new Blob([outputEl.value]).size;
    inLen.textContent = inB + " B";
    outLen.textContent = outB + " B";
    statsEl.innerHTML = inB > 0 && outB > 0 ? `<b>${(outB / inB).toFixed(2)}x</b>` : "—";
  }

  inputEl.addEventListener("input", updateStats);
  outputEl.addEventListener("input", updateStats);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentLang = tab.dataset.lang;
      const names = { js: "JS", ts: "TS", css: "CSS", wasm: "WASM" };
      inLabel.textContent = "Вход — " + names[currentLang];
      outLabel.textContent = "Выход — Noxium (" + names[currentLang] + ")";
      inputEl.placeholder = "// Вставь " + names[currentLang] + "-код...";
    });
  });

  $("btnObf").addEventListener("click", () => {
    try {
      const src = inputEl.value;
      if (!src.trim()) { outputEl.value = "// пусто"; return; }
      outputEl.value = obfuscate(src, currentLang);
      updateStats();
    } catch (e) {
      outputEl.value = "// ошибка: " + e.message + "\n" + e.stack;
    }
  });

  $("btnCopy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(outputEl.value);
      $("btnCopy").textContent = "Скопировано";
      setTimeout(() => { $("btnCopy").textContent = "Копировать"; }, 1200);
    } catch (e) {}
  });

  $("btnClear").addEventListener("click", () => {
    inputEl.value = ""; outputEl.value = ""; updateStats();
  });
})();
</script>
</body>
      </html>
