<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noxium</title>
<style>
  :root{--bg:#0a0a0c;--panel:#111114;--border:#1e1e24;--text:#c8c8d0;--dim:#6a6a78;--accent:#7f5af0;--accent2:#2cb67d;--danger:#e5484d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:ui-monospace,'Cascadia Code','Fira Code',monospace;min-height:100vh;display:flex;flex-direction:column;padding:24px;gap:16px}
  header{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border);padding-bottom:12px;flex-wrap:wrap}
  header h1{font-size:20px;letter-spacing:2px;color:var(--accent)}
  header .ver{font-size:12px;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{background:var(--border);color:var(--dim);border:none;border-radius:6px 6px 0 0;padding:6px 14px;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:1px}
  .tab.active{background:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-height:0}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;line-height:1.5;padding:12px;resize:none;outline:none;min-height:300px;tab-size:2}
  textarea::placeholder{color:var(--dim)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:10px 20px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:1px;transition:filter .15s}
  button:hover{filter:brightness(1.15)}
  button.secondary{background:var(--border);color:var(--text)}
  label.opt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
  label.opt input{accent-color:var(--accent)}
  .stats{font-size:12px;color:var(--dim);margin-left:auto}
  .stats b{color:var(--accent2)}
  footer{font-size:11px;color:var(--dim);text-align:center}
</style>
</head>
<body>

<header>
  <h1>NOXIUM</h1>
  <span class="ver">v1.1</span>
  <div class="tabs">
    <button class="tab active" data-lang="luau">Luau</button>
    <button class="tab" data-lang="lua51">Lua 5.1</button>
  </div>
</header>

<div class="controls">
  <button id="btnObf">Обфусцировать</button>
  <button id="btnCopy" class="secondary">Копировать</button>
  <button id="btnClear" class="secondary">Очистить</button>
  <label class="opt"><input type="checkbox" id="optPseudo" checked> pseudo</label>
  <label class="opt"><input type="checkbox" id="optReturn" checked> local-return</label>
  <label class="opt"><input type="checkbox" id="optStrings" checked> шифр строк</label>
  <label class="opt"><input type="checkbox" id="optGuard" checked> guard</label>
  <span class="stats" id="stats">—</span>
</div>

<div class="grid">
  <div class="panel">
    <div class="panel-head"><span id="inLabel">Вход — Luau</span><span id="inLen">0 B</span></div>
    <textarea id="input" placeholder="-- Вставь Luau-код..." spellcheck="false"></textarea>
  </div>
  <div class="panel">
    <div class="panel-head"><span id="outLabel">Выход — Noxium (Luau)</span><span id="outLen">0 B</span></div>
    <textarea id="output" placeholder="-- Результат" spellcheck="false" readonly></textarea>
  </div>
</div>

<footer>Noxium — локальный обфускатор. Цели: Luau / Lua 5.1. Ничего не отправляет.</footer>

<script>
(function () {
  "use strict";

  // ---- мигающий title ----
  const titleStates = ["Noxium", "N o x i u m", "N0xium", "NOXIUM", "Noxium_", "Noxium ●", "Noxium ○"];
  let titleIdx = 0;
  setInterval(() => { titleIdx = (titleIdx + 1) % titleStates.length; document.title = titleStates[titleIdx]; }, 500);

  const $ = (id) => document.getElementById(id);
  const inputEl = $("input"), outputEl = $("output"), statsEl = $("stats");
  const inLen = $("inLen"), outLen = $("outLen");
  const inLabel = $("inLabel"), outLabel = $("outLabel");

  let currentLang = "luau";

  const randHex = (n) => { let s = ""; for (let i = 0; i < n; i++) s += "0123456789abcdef"[(Math.random()*16)|0]; return s; };
  const randName = (p) => p + "_" + randHex(8);

  // ---- FNV-1a ----
  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return h.toString(16);
  }

  // ---- XOR + base64 ----
  function xorB64(str, key) {
    let out = "";
    for (let i = 0; i < str.length; i++) out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return btoa(unescape(encodeURIComponent(out)));
  }

  // ---- профили целей ----
  const TARGETS = {
    luau: {
      name: "Luau",
      keywords: "and break do else elseif end false for function if in local nil not or repeat return then true until while continue export type typeof",
      globals: "game workspace script math string table os task wait spawn delay tick time print warn error assert pcall xpcall select type typeof tonumber tostring pairs ipairs next setmetatable getmetatable rawget rawset rawequal rawlen require Instance Vector3 Vector2 CFrame Color3 ColorSequence NumberSequence UDim UDim2 BrickColor Enum Ray Region3 TweenInfo PhysicalProperties Random Font DateTime Rect Axes Faces NumberRange NumberSequenceKeypoint ColorSequenceKeypoint RaycastParams OverlapParams Path2D PathWaypoint _G shared bit32 utf8 buffer"
    },
    lua51: {
      name: "Lua 5.1",
      keywords: "and break do else elseif end false for function if in local nil not or repeat return then true until while",
      globals: "math string table os io coroutine debug package _G _VERSION print error assert pcall xpcall select type tonumber tostring pairs ipairs next setmetatable getmetatable rawget rawset rawequal unpack require module loadstring loadfile dofile collectgarbage newproxy gcinfo"
    }
  };

  // ---- лексер Luau / Lua 5.1 ----
  function lexLua(src, target) {
    const strings = [];
    const comments = [];
    let out = "";
    let i = 0;
    const n = src.length;

    function readLongBracket(start) {
      let eq = 0;
      let j = start + 1;
      while (src[j] === "=") { eq++; j++; }
      if (src[j] !== "[") return null;
      const close = "]" + "=".repeat(eq) + "]";
      let k = j + 1;
      while (k < n && !src.startsWith(close, k)) k++;
      if (k >= n) return null;
      return { end: k + close.length };
    }

    while (i < n) {
      const c = src[i];

      if (c === "-" && src[i+1] === "-") {
        if (src[i+2] === "[") {
          const lb = readLongBracket(i + 2);
          if (lb) {
            comments.push(src.slice(i, lb.end));
            out += "__NCom" + (comments.length - 1) + "__";
            i = lb.end; continue;
          }
        }
        let j = i + 2;
        while (j < n && src[j] !== "\n") j++;
        comments.push(src.slice(i, j));
        out += "__NCom" + (comments.length - 1) + "__";
        i = j; continue;
      }

      if (c === "[" && (src[i+1] === "[" || src[i+1] === "=")) {
        const lb = readLongBracket(i);
        if (lb) {
          strings.push(src.slice(i, lb.end));
          out += "__NStr" + (strings.length - 1) + "__";
          i = lb.end; continue;
        }
      }

      if (c === '"' || c === "'") {
        const quote = c;
        let j = i + 1;
        let val = "";
        while (j < n) {
          if (src[j] === "\\") { val += src[j] + src[j+1]; j += 2; continue; }
          if (src[j] === quote) break;
          val += src[j]; j++;
        }
        strings.push(quote + val + quote);
        out += "__NStr" + (strings.length - 1) + "__";
        i = j + 1; continue;
      }

      if (target === "luau" && c === "`") {
        let j = i + 1;
        let val = "";
        while (j < n) {
          if (src[j] === "\\") { val += src[j] + src[j+1]; j += 2; continue; }
          if (src[j] === "`") break;
          val += src[j]; j++;
        }
        strings.push("`" + val + "`");
        out += "__NStr" + (strings.length - 1) + "__";
        i = j + 1; continue;
      }

      out += c;
      i++;
    }
    return { code: out, strings, comments };
  }

  // ---- переименование ----
  function renameIds(code, target) {
    const t = TARGETS[target];
    const KW = new Set(t.keywords.split(" "));
    const GLOBALS = new Set(t.globals.split(" "));
    const map = new Map();
    let braceDepth = 0;
    const re = /[A-Za-z_][A-Za-z0-9_]*/g;
    let m;
    let lastIndex = 0;
    let result = "";
    while ((m = re.exec(code)) !== null) {
      const id = m[0];
      const start = m.index;
      const end = start + id.length;
      for (let k = lastIndex; k < start; k++) {
        if (code[k] === "{") braceDepth++;
        else if (code[k] === "}") braceDepth--;
      }
      result += code.slice(lastIndex, start);
      lastIndex = end;

      if (id.startsWith("__N")) { result += id; continue; }
      if (KW.has(id)) { result += id; continue; }
      if (GLOBALS.has(id)) { result += id; continue; }

      const before = code.slice(Math.max(0, start - 2), start).trimEnd();
      const after = code.slice(end, end + 2).trimStart();

      if (before.endsWith(".") || before.endsWith(":")) { result += id; continue; }
      if (after.startsWith("=") && !after.startsWith("==") && braceDepth > 0) { result += id; continue; }

      if (!map.has(id)) map.set(id, randName("_x"));
      result += map.get(id);
    }
    result += code.slice(lastIndex);
    return result;
  }

  // ---- local-return ----
  function localReturnWrap(code) {
    return code.replace(/(function\s*[A-Za-z0-9_]*\s*\([^)]*\)\s*)((?:.|\n)*?)(\bend\b)/g, (full, head, body, tail) => {
      if (/\breturn\b/.test(body)) return full;
      if (!body.trim()) return full;
      return head + " do return (function()" + body + " end)() end " + tail;
    });
  }

  // ---- шифр строк ----
  function cipherStrings(strings) {
    const key = randHex(16);
    const enc = strings.map(s => xorB64(s, key));
    return { key, enc };
  }

  // ---- шифр фразы "koch bratan": [язык, номер буквы] ----
  const RU_ALPHA = "абвгдеёжзийклмнопрстуфхцчшщъыьэюя";
  const EN_ALPHA = "abcdefghijklmnopqrstuvwxyz";

  function encodePhrase(str) {
    const pairs = [];
    for (const ch of str.toLowerCase()) {
      if (ch === " ") { pairs.push([0, 0]); continue; }
      const ru = RU_ALPHA.indexOf(ch);
      if (ru >= 0) { pairs.push([0, ru + 1]); continue; }
      const en = EN_ALPHA.indexOf(ch);
      if (en >= 0) { pairs.push([1, en + 1]); continue; }
      pairs.push([-1, ch.charCodeAt(0)]);
    }
    return pairs;
  }

  function buildDecoder() {
    return `local RA="абвгдеёжзийклмнопрстуфхцчшщъыьэюя"local EA="abcdefghijklmnopqrstuvwxyz"local function D(P)local o=""for _,p in ipairs(P)do local l,i=p[1],p[2]if l==0 and i==0 then o=o.." "elseif l==0 then o=o..string.sub(RA,i,i)elseif l==1 then o=o..string.sub(EA,i,i)elseif l==-1 then o=o..string.char(i)end end return o end`;
  }

  function buildPairStash(pairs) {
    const stashes = [];
    let cur = [];
    for (const p of pairs) {
      cur.push(p);
      if (cur.length >= 3) { stashes.push(cur); cur = []; }
    }
    if (cur.length) stashes.push(cur);
    return stashes.map(group => {
      const name = "_p" + randHex(6);
      const body = "{" + group.map(p => `{${p[0]},${p[1]}}`).join(",") + "}";
      return { name, body };
    });
  }

  function sprinkleStash(code, stashes) {
    if (!stashes.length) return code;
    const lines = code.split("\n");
    const out = lines.slice();
    for (const s of stashes) {
      const pos = Math.min(out.length, Math.floor(Math.random() * out.length));
      out.splice(pos, 0, `local ${s.name}=${s.body}`);
    }
    return out.join("\n");
  }

  // ---- guard: куски, без подписи ----
  function buildGuardParts(hash, target, decoder, pairExpr) {
    if (target === "luau") {
      return [
        `local H="${hash}"`,
        decoder,
        `local function F(s)local h=2166136261 for i=1,#s do h=bit32.bxor(h,string.byte(s,i))h=bit32.band(h+bit32.lshift(h,1)+bit32.lshift(h,4)+bit32.lshift(h,7)+bit32.lshift(h,8)+bit32.lshift(h,24),0xFFFFFFFF)end return string.format("%x",h)end`,
        `local T={}pcall(function()local i=debug.info(1,"s")if i and i~=""and F(i)~=H then table.insert(T,"h")end end)`,
        `pcall(function()if hookfunction and tostring(hookfunction):find("function")==nil then table.insert(T,"k")end end)`,
        `pcall(function()local w=tostring(warn)if w:find("C function")==nil and w:find("function")==nil then table.insert(T,"w")end end)`,
        `if not _G.__s__ then _G.__s__={v=1,t=os.time()}elseif _G.__s__.v~=1 then table.insert(T,"s")end`,
        `if #T>0 then local P={}for _,v in ipairs({${pairExpr}})do for _,p in ipairs(v)do table.insert(P,p)end end local m=D(P)local function S()pcall(function()warn(m)end)pcall(function()print(m)end)end S()task.spawn(function()while true do S()task.wait(.25)end end)task.spawn(function()while true do pcall(function()error(m)end)task.wait()end end)local function B()pcall(B)end task.spawn(B)task.spawn(function()local a={}while true do table.insert(a,string.rep("x",1000))task.wait()end end)task.spawn(function()while true do pcall(function()_G.game=nil _G.workspace=nil _G.script=nil end)task.wait()end end)pcall(function()if game and game:GetService("Players")and game:GetService("Players").LocalPlayer then local p=game:GetService("Players").LocalPlayer task.spawn(function()while true do pcall(function()p.DisplayName=m end)task.wait(.1)end end)end end)end`
      ];
    }
    return [
      `local H="${hash}"`,
      decoder,
      `local function X(a,b)local r,p=0,1 while a>0 or b>0 do local x,y=a%2,b%2 if x~=y then r=r+p end a=math.floor(a/2)b=math.floor(b/2)p=p*2 end return r end`,
      `local function F(s)local h=2166136261 for i=1,#s do h=X(h,string.byte(s,i))h=(h+h*2+h*16+h*128+h*256+h*16777216)%4294967296 end return string.format("%x",h)end`,
      `local T={}pcall(function()if debug and debug.getinfo then local i=debug.getinfo(1,"S").source if i and i~=""and F(i)~=H then table.insert(T,"h")end end end)`,
      `pcall(function()local w=tostring(print)if not w:find("function")and not w:find("C function")then table.insert(T,"w")end end)`,
      `if not _G.__s__ then _G.__s__={v=1,t=os.time()}elseif _G.__s__.v~=1 then table.insert(T,"s")end`,
      `if #T>0 then local P={}for _,v in ipairs({${pairExpr}})do for _,p in ipairs(v)do table.insert(P,p)end end local m=D(P)while true do pcall(function()print(m)end)pcall(function()error(m)end)pcall(function()_G.game=nil _G.workspace=nil end)end end`
    ];
  }

  // ---- раскидываем куски guard по коду ----
  function sprinkleGuard(code, parts, target) {
    if (!parts.length) return code;

    const lines = [];
    let i = 0;
    const n = code.length;
    let buf = "";
    let depth = 0;

    while (i < n) {
      const c = code[i];
      if (c === "-" && code[i+1] === "-") {
        if (code[i+2] === "[") {
          let eq = 0, j = i + 3;
          while (code[j] === "=") { eq++; j++; }
          if (code[j] === "[") {
            const close = "]" + "=".repeat(eq) + "]";
            let k = j + 1;
            while (k < n && !code.startsWith(close, k)) k++;
            k += close.length;
            buf += code.slice(i, k);
            i = k; continue;
          }
        }
        let j = i + 2;
        while (j < n && code[j] !== "\n") j++;
        buf += code.slice(i, j);
        i = j; continue;
      }
      if (c === '"' || c === "'") {
        const q = c; let j = i + 1;
        while (j < n) {
          if (code[j] === "\\") { j += 2; continue; }
          if (code[j] === q) break;
          j++;
        }
        buf += code.slice(i, j + 1);
        i = j + 1; continue;
      }
      if (c === "`" && target === "luau") {
        let j = i + 1;
        while (j < n) {
          if (code[j] === "\\") { j += 2; continue; }
          if (code[j] === "`") break;
          j++;
        }
        buf += code.slice(i, j + 1);
        i = j + 1; continue;
      }
      if (c === "{" || c === "(" || c === "[") depth++;
      if (c === "}" || c === ")" || c === "]") depth--;
      if (c === "\n" && depth === 0) {
        lines.push(buf);
        buf = "";
        i++; continue;
      }
      buf += c;
      i++;
    }
    if (buf) lines.push(buf);

    if (lines.length === 0) return code;

    const positions = [];
    for (let k = 0; k < parts.length; k++) {
      positions.push(Math.floor(Math.random() * (lines.length + 1)));
    }
    positions.sort((a, b) => a - b);

    const masked = parts.map((p) => {
      const name = "_" + randHex(8);
      return `local function ${name}() ${p} end ${name}()`;
    });

    const outLines = [];
    let pi = 0;
    for (let l = 0; l <= lines.length; l++) {
      while (pi < masked.length && positions[pi] === l) {
        outLines.push(masked[pi]);
        pi++;
      }
      if (l < lines.length) outLines.push(lines[l]);
    }
    return outLines.join("\n");
  }

  // ---- схлопывание в одну строку ----
  function minifyLua(code, target) {
    const out = [];
    let i = 0;
    const n = code.length;
    let lastWasSpace = false;
    const isLuau = target === "luau";

    function readLongBracket(start) {
      let eq = 0;
      let j = start + 1;
      while (code[j] === "=") { eq++; j++; }
      if (code[j] !== "[") return null;
      const close = "]" + "=".repeat(eq) + "]";
      let k = j + 1;
      while (k < n && !code.startsWith(close, k)) k++;
      if (k >= n) return null;
      return { end: k + close.length };
    }

    while (i < n) {
      const c = code[i];

      if (c === "-" && code[i+1] === "-") {
        if (code[i+2] === "[") {
          const lb = readLongBracket(i + 2);
          if (lb) {
            out.push(code.slice(i, lb.end));
            i = lb.end; lastWasSpace = false; continue;
          }
        }
        let j = i + 2;
        while (j < n && code[j] !== "\n") j++;
        i = j; continue;
      }

      if (c === "[" && (code[i+1] === "[" || code[i+1] === "=")) {
        const lb = readLongBracket(i);
        if (lb) {
          out.push(code.slice(i, lb.end));
          i = lb.end; lastWasSpace = false; continue;
        }
      }

      if (c === '"' || c === "'") {
        const quote = c;
        let j = i + 1;
        while (j < n) {
          if (code[j] === "\\") { j += 2; continue; }
          if (code[j] === quote) break;
          j++;
        }
        out.push(code.slice(i, j + 1));
        i = j + 1; lastWasSpace = false; continue;
      }

      if (isLuau && c === "`") {
        let j = i + 1;
        while (j < n) {
          if (code[j] === "\\") { j += 2; continue; }
          if (code[j] === "`") break;
          j++;
        }
        out.push(code.slice(i, j + 1));
        i = j + 1; lastWasSpace = false; continue;
      }

      if (/\s/.test(c)) {
        if (!lastWasSpace && out.length > 0) { out.push(" "); lastWasSpace = true; }
        i++; continue;
      }

      out.push(c);
      lastWasSpace = false;
      i++;
    }

    let s = out.join("");
    s = s.replace(/\s*([=+\-*/%<>~^#&|,;:\(\)\[\]\{\}\.])\s*/g, "$1");
    s = s.replace(/([A-Za-z0-9_])\s+([A-Za-z0-9_])/g, "$1 $2");
    s = s.replace(/;+/g, ";").replace(/^;+|;+$/g, "");
    return s;
  }

  // ---- пайплайн ----
  function obfuscate(src, target) {
    const usePseudo = $("optPseudo").checked;
    const useReturn = $("optReturn").checked;
    const useStrings = $("optStrings").checked;
    const useGuard = $("optGuard").checked;

    let code = src;
    const lexed = lexLua(code, target);
    code = lexed.code;

    if (usePseudo) code = renameIds(code, target);
    if (useReturn) code = localReturnWrap(code);

    let stringTable = "";
    if (useStrings && lexed.strings.length > 0) {
      const { key, enc } = cipherStrings(lexed.strings);
      if (target === "luau") {
        stringTable = `local k="${key}"local s={${enc.map(e => `"${e}"`).join(",")}}local function d(x)local r=""for i=1,#x do r=r..string.char(bit32.bxor(string.byte(x,i),string.byte(k,(i-1)%#k+1)))end return r end local function g(i)return d(s[i+1])end `;
        code = code.replace(/__NStr(\d+)__/g, (m, idx) => `g(${idx})`);
      } else {
        stringTable = `local k="${key}"local s={${enc.map(e => `"${e}"`).join(",")}}local function X(a,b)local r,p=0,1 while a>0 or b>0 do local x,y=a%2,b%2 if x~=y then r=r+p end a=math.floor(a/2)b=math.floor(b/2)p=p*2 end return r end local function d(x)local r=""for i=1,#x do r=r..string.char(X(string.byte(x,i),string.byte(k,(i-1)%#k+1)))end return r end local function g(i)return d(s[i+1])end `;
        code = code.replace(/__NStr(\d+)__/g, (m, idx) => `g(${idx})`);
      }
    } else {
      code = code.replace(/__NStr(\d+)__/g, (m, idx) => lexed.strings[+idx]);
    }

    code = code.replace(/__NCom(\d+)__/g, (m, idx) => lexed.comments[+idx]);

    let out = stringTable + code;

    // ---- koch bratan cipher + sprinkled guard ----
    if (useGuard) {
      const phrase = encodePhrase("koch bratan");
      const stashes = buildPairStash(phrase);
      const stashNames = stashes.map(s => s.name);
      out = sprinkleStash(out, stashes);

      const decoder = buildDecoder();
      const pairExpr = stashNames.join(",");
      const parts = buildGuardParts(fnv1a(out), target, decoder, pairExpr);
      out = sprinkleGuard(out, parts, target);
    }

    out = minifyLua(out, target);
    return out;
  }

  // ---- UI ----
  function updateStats() {
    const inB = new Blob([inputEl.value]).size;
    const outB = new Blob([outputEl.value]).size;
    inLen.textContent = inB + " B";
    outLen.textContent = outB + " B";
    statsEl.innerHTML = inB > 0 && outB > 0 ? `<b>${(outB / inB).toFixed(2)}x</b>` : "—";
  }

  inputEl.addEventListener("input", updateStats);
  outputEl.addEventListener("input", updateStats);

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      currentLang = tab.dataset.lang;
      const names = { luau: "Luau", lua51: "Lua 5.1" };
      inLabel.textContent = "Вход — " + names[currentLang];
      outLabel.textContent = "Выход — Noxium (" + names[currentLang] + ")";
      inputEl.placeholder = "-- Вставь " + names[currentLang] + "-код...";
    });
  });

  $("btnObf").addEventListener("click", () => {
    try {
      const src = inputEl.value;
      if (!src.trim()) { outputEl.value = "-- пусто"; return; }
      outputEl.value = obfuscate(src, currentLang);
      updateStats();
    } catch (e) {
      outputEl.value = "-- ошибка: " + e.message + "\n" + e.stack;
    }
  });

  $("btnCopy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(outputEl.value);
      $("btnCopy").textContent = "Скопировано";
      setTimeout(() => { $("btnCopy").textContent = "Копировать"; }, 1200);
    } catch (e) {}
  });

  $("btnClear").addEventListener("click", () => {
    inputEl.value = ""; outputEl.value = ""; updateStats();
  });
})();
</script>
</body>
